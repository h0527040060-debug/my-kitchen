# Use only after choosing a server and pointing a domain at it.
services:
  api:
    environment:
      COOKIE_SECURE: "true"
      TRUST_PROXY_HOPS: "1"
      APP_ORIGIN: https://${KITCHEN_DOMAIN:?Set KITCHEN_DOMAIN}
  worker:
    environment:
      COOKIE_SECURE: "true"
      TRUST_PROXY_HOPS: "1"
      APP_ORIGIN: https://${KITCHEN_DOMAIN:?Set KITCHEN_DOMAIN}
  proxy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      KITCHEN_DOMAIN: ${KITCHEN_DOMAIN:?Set KITCHEN_DOMAIN}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    restart: unless-stopped
volumes:
  caddy-data:
  caddy-config:
