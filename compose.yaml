services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: kitchen
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
      KITCHEN_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/10-runtime-role.sh:/docker-entrypoint-initdb.d/10-runtime-role.sh:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U kitchen -d kitchen]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build: .
    env_file: .env
    environment:
      POSTGRES_ADMIN_PASSWORD: ""
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - media-data:/app/data
      - backup-data:/app/backups
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  worker:
    build: .
    command: [node, --experimental-strip-types, server/worker.ts]
    env_file: .env
    environment:
      POSTGRES_ADMIN_PASSWORD: ""
    volumes:
      - media-data:/app/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres-data:
  media-data:
  backup-data:
